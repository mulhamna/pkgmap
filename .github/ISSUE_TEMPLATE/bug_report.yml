name: Bug report
description: Report something broken in pkgmap
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill the fields below so we can reproduce fast.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands / flags used.
      placeholder: |
        1. Run `pkgmap --manager brew`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: dropdown
    id: manager
    attributes:
      label: Affected package manager
      options:
        - npm
        - pnpm
        - yarn
        - brew
        - volta
        - pip
        - cargo
        - gem
        - all / multiple
        - not manager-specific
        - other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.5 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: pkgmap requires Node >= 20.
      placeholder: v22.3.0
    validations:
      required: true
  - type: input
    id: pkgmap-version
    attributes:
      label: pkgmap version
      placeholder: 1.12.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste terminal output. Automatically formatted as code.
      render: shell
